<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f6fb">
  <title>Vanjski embed demo — FlyRank</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 18px;
      color: #17243b;
      background: #f3f6fb;
      font: 16px/1.5 Arial, sans-serif;
    }
    main {
      width: min(760px, 100%);
      margin: 0 auto;
    }
    header, .embed-panel {
      padding: 24px;
      border-radius: 14px;
      background: #fff;
      box-shadow: 0 8px 28px #17243b12;
    }
    header {
      margin-bottom: 20px;
      color: white;
      background: #142b4a;
    }
    h1, h2 { margin-top: 0; }
    .hint { color: #63718a; }
    header .hint { color: #dbe9f8; }
    code {
      padding: 2px 5px;
      border-radius: 4px;
      background: #eef3fa;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Vanjska stranica — embed demo</h1>
      <p class="hint">
        Ovaj obrazac se učitava preko jednog eksternog script taga sa FlyRank servera.
      </p>
    </header>

    <section class="embed-panel">
      <h2>Kontakt obrazac</h2>
      <p class="hint">
        Javni ključ za lokalnu probu: <code>demo-widget</code>.
      </p>
      <script
        src="http://localhost:3000/widget/v1.js"
        data-widget-key="demo-widget"></script>
    </section>
  </main>
</body>
</html>
